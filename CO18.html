<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>College Gallery</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#11998e,#38ef7d);

}

header{

background:#004d40;

color:white;

padding:25px;

text-align:center;

font-size:35px;

font-weight:bold;

}

.container{

width:90%;

margin:auto;

padding:30px;

}

.card{

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 10px 20px rgba(0,0,0,.3);

margin-bottom:30px;

}

h2{

color:#00796b;

margin-bottom:20px;

}

.gallery{

display:flex;

justify-content:space-around;

flex-wrap:wrap;

gap:20px;

}

.gallery img{

width:300px;

height:200px;

border-radius:15px;

border:5px solid #26a69a;

transition:.4s;

}

.gallery img:hover{

transform:scale(1.08);

}

.links{

text-align:center;

}

.links a{

display:inline-block;

margin:10px;

padding:12px 25px;

background:#00796b;

color:white;

text-decoration:none;

border-radius:30px;

font-size:18px;

transition:.4s;

}

.links a:hover{

background:#004d40;

}

iframe{

width:100%;

height:400px;

border:none;

border-radius:15px;

}

footer{

background:#004d40;

color:white;

text-align:center;

padding:20px;

font-size:18px;

}

</style>

</head>

<body>

<header>

🏫 ABC College of Engineering

</header>

<div class="container">

<div class="card">

<h2>📸 College Gallery</h2>

<div class="gallery">

<img src="college1.jpg" alt="College Building">

<img src="college2.jpg" alt="Library">

<img src="college3.jpg" alt="Computer Lab">

</div>

</div>

<div class="card">

<h2>🔗 Useful Links</h2>

<div class="links">

<a href="https://www.google.com" target="_blank">Google</a>

<a href="https://www.wikipedia.org" target="_blank">Wikipedia</a>

<a href="https://github.com" target="_blank">GitHub</a>

</div>

</div>

<div class="card">

<h2>🗺 College Location</h2>

<iframe
src="https://maps.google.com/maps?q=Hyderabad&t=&z=13&ie=UTF8&iwloc=&output=embed">
</iframe>

</div>

<div class="card">

<h2>🌐 Embedded Website</h2>

<iframe src="https://www.wikipedia.org"></iframe>

</div>

</div>

<footer>

Designed by Your Name © 2026

</footer>

</body>
</html>
