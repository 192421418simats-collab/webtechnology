<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration Form</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#667eea,#764ba2);

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

padding:30px;

}

.container{

width:700px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(12px);

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.4);

color:white;

}

h1{

text-align:center;

margin-bottom:25px;

}

table{

width:100%;

}

td{

padding:12px;

}

input[type=text],
input[type=password],
input[type=email],
input[type=tel],
input[type=date],
select,
textarea{

width:100%;

padding:12px;

border:none;

border-radius:8px;

font-size:16px;

outline:none;

}

textarea{

resize:none;

}

.gender{

margin-right:15px;

}

.skills{

margin-right:15px;

}

input[type=file]{

color:white;

}

.buttons{

text-align:center;

padding-top:20px;

}

input[type=submit]{

background:#00e676;

color:black;

padding:12px 35px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

margin-right:15px;

font-weight:bold;

transition:.4s;

}

input[type=submit]:hover{

background:white;

}

input[type=reset]{

background:#ff1744;

color:white;

padding:12px 35px;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

font-weight:bold;

transition:.4s;

}

input[type=reset]:hover{

background:#d50000;

}

.footer{

text-align:center;

margin-top:20px;

font-size:16px;

}

</style>

</head>

<body>

<div class="container">

<h1>🎓 Student Registration Form</h1>

<form>

<table>

<tr>

<td>Full Name</td>

<td>

<input type="text" placeholder="Enter Full Name">

</td>

</tr>

<tr>

<td>Email</td>

<td>

<input type="email" placeholder="Enter Email">

</td>

</tr>

<tr>

<td>Password</td>

<td>

<input type="password" placeholder="Enter Password">

</td>

</tr>

<tr>

<td>Mobile Number</td>

<td>

<input type="tel" placeholder="Enter Mobile Number">

</td>

</tr>

<tr>

<td>Date of Birth</td>

<td>

<input type="date">

</td>

</tr>

<tr>

<td>Gender</td>

<td>

<label class="gender">

<input type="radio" name="gender">

Male

</label>

<label class="gender">

<input type="radio" name="gender">

Female

</label>

<label class="gender">

<input type="radio" name="gender">

Other

</label>

</td>

</tr>

<tr>

<td>Department</td>

<td>

<select>

<option>Select Department</option>

<option>CSE</option>

<option>ECE</option>

<option>EEE</option>

<option>MECH</option>

<option>CIVIL</option>

</select>

</td>

</tr>

<tr>

<td>Skills</td>

<td>

<label class="skills">

<input type="checkbox">

HTML

</label>

<label class="skills">

<input type="checkbox">

CSS

</label>

<label class="skills">

<input type="checkbox">

JavaScript

</label>

<label class="skills">

<input type="checkbox">

Python

</label>

</td>

</tr>

<tr>

<td>Address</td>

<td>

<textarea rows="4" placeholder="Enter Address"></textarea>

</td>

</tr>

<tr>

<td>Upload Photo</td>

<td>

<input type="file">

</td>

</tr>

<tr>

<td colspan="2" class="buttons">

<input type="submit" value="Register">

<input type="reset" value="Clear">

</td>

</tr>

</table>

</form>

<div class="footer">

<p>ABC College Admission Portal © 2026</p>

</div>

</div>

</body>

</html>
