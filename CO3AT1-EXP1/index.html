<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM-Based Student Registration Preview</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202a;
      --muted: #5d6872;
      --paper: #f4f7f8;
      --panel: #ffffff;
      --line: #d7e0e4;
      --accent: #126e82;
      --accent-dark: #0c5261;
      --highlight: #e4f3f4;
      --danger: #a33b3b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .intro {
      margin-bottom: 24px;
      border-left: 5px solid var(--accent);
      padding-left: 18px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      font-weight: 700;
    }

    .intro p {
      max-width: 650px;
      margin-bottom: 0;
      color: var(--muted);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .panel {
      padding: 26px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 12px 30px rgba(23, 32, 42, 0.07);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.45rem;
    }

    .field {
      display: block;
      margin-bottom: 16px;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input,
    select,
    button {
      width: 100%;
      min-height: 44px;
      margin-top: 7px;
      border-radius: 3px;
      font: inherit;
    }

    input,
    select {
      padding: 10px 12px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fbfcfc;
      font-family: Arial, sans-serif;
    }

    input:focus,
    select:focus {
      outline: 3px solid rgba(18, 110, 130, 0.2);
      border-color: var(--accent);
    }

    button {
      padding: 10px 16px;
      border: 0;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      font-family: Arial, sans-serif;
      font-weight: 700;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .empty-state {
      color: var(--muted);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    .student-profile {
      position: relative;
      padding: 20px;
      border: 1px solid #a8d6d9;
      border-top: 6px solid var(--accent);
      background: var(--highlight);
      animation: profile-in 220ms ease-out;
    }

    .student-profile h3 {
      margin: 0 0 16px;
      font-size: 1.6rem;
    }

    .profile-details {
      display: grid;
      gap: 11px;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(18, 110, 130, 0.2);
    }

    .profile-row dt {
      color: var(--muted);
      font-weight: 700;
    }

    .profile-row dd {
      margin: 0;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .remove-button {
      margin-top: 20px;
      color: var(--danger);
      background: transparent;
      border: 1px solid currentColor;
    }

    .remove-button:hover {
      color: #fff;
      background: var(--danger);
    }

    @keyframes profile-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 24px 14px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <h1>Student Registration Preview</h1>
      <p>Enter student details to generate a live profile using the DOM.</p>
    </header>

    <section class="workspace" aria-label="Student registration workspace">
      <form id="registrationForm" class="panel">
        <h2>Registration form</h2>

        <label class="field" for="studentName">
          Name
          <input id="studentName" name="name" type="text" placeholder="e.g. Asha Kumar" required>
        </label>

        <label class="field" for="registerNumber">
          Register Number
          <input id="registerNumber" name="registerNumber" type="text" placeholder="e.g. CS2026001" required>
        </label>

        <label class="field" for="department">
          Department
          <input id="department" name="department" type="text" placeholder="e.g. Computer Science" required>
        </label>

        <label class="field" for="yearOfStudy">
          Year of Study
          <select id="yearOfStudy" name="yearOfStudy" required>
            <option value="">Select year</option>
            <option value="First Year">First Year</option>
            <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
            <option value="Final Year">Final Year</option>
          </select>
        </label>

        <button type="submit">Generate Profile</button>
      </form>

      <section id="profilePanel" class="panel" aria-live="polite">
        <h2>Generated profile</h2>
        <p id="emptyState" class="empty-state">Your student profile will appear here after submission.</p>
      </section>
    </section>
  </main>

  <script>
    const registrationForm = document.getElementById("registrationForm");
    const profilePanel = document.getElementById("profilePanel");
    const emptyState = document.getElementById("emptyState");

    registrationForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const existingProfile = document.getElementById("studentProfile");
      if (existingProfile) {
        existingProfile.remove();
      }

      const profile = document.createElement("article");
      profile.id = "studentProfile";
      profile.classList.add("student-profile");

      const profileTitle = document.createElement("h3");
      profileTitle.textContent = document.getElementById("studentName").value.trim();
      profile.appendChild(profileTitle);

      const details = document.createElement("dl");
      details.classList.add("profile-details");

      const profileFields = [
        ["Register Number", document.getElementById("registerNumber").value.trim()],
        ["Department", document.getElementById("department").value.trim()],
        ["Year of Study", document.getElementById("yearOfStudy").value]
      ];

      profileFields.forEach(([label, value]) => {
        const row = document.createElement("div");
        row.classList.add("profile-row");

        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value;

        row.append(term, description);
        details.appendChild(row);
      });

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.classList.add("remove-button");
      removeButton.textContent = "Remove Profile";
      removeButton.addEventListener("click", () => {
        profile.remove();
        emptyState.hidden = false;
      });

      profile.append(details, removeButton);
      profilePanel.appendChild(profile);
      emptyState.hidden = true;
    });
  </script>
</body>
</html>
