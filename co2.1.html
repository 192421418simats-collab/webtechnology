<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - ALUKA PARDHU</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 30px;
        }

        .profile {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 25px;
            padding: 35px;
            border: 5px solid #ffffff;
            box-shadow: 0 10px 30px #333;
        }

        .header {
            text-align: center;
            padding: 20px;
        }

        .header img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #667eea;
            margin-bottom: 15px;
        }

        h1 {
            color: #667eea;
            font-size: 35px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            font-size: 18px;
        }

        .section {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #f4f6ff;
            border-left: 6px solid #667eea;
        }

        .section h2 {
            color: #764ba2;
            margin-bottom: 12px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill {
            background: #667eea;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .profile {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .header img {
                width: 130px;
                height: 130px;
            }

            .skill {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="profile">

    <div class="header">
        <img src="https://images.unsplash.com/photo-1531482615713-2afd69097998"
             alt="Student Profile">

        <h1>ALUKA PARDHU</h1>

        <p class="subtitle">
            Engineering Student | Web Developer | Programmer
        </p>
    </div>

    <div class="section">
        <h2>About Me</h2>
        <p>
            Hello! My name is ALUKA PARDHU. I am an engineering
            student
