<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
  <title>XHTML Example</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #ecfccb, #dcfce7, #f0fdf4);
      font-family: Arial, sans-serif;
      padding: 30px;
      color: #14532d;
    }
    h1 {
      color: #15803d;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.8;
    }
    hr {
      border: 0;
      height: 3px;
      background: linear-gradient(90deg, #22c55e, #84cc16, #a3e635);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>Welcome to XHTML</h1>
  <p>This is a valid XHTML page.</p>
  <p>It uses lowercase tags, quoted attributes, and self-closing tags like <br /> and <hr /></p>
  <hr />
  <p><b>Bold</b> text and <i>italic</i> text are supported.</p>
</body>
</html>
