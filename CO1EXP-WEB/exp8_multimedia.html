<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment 8: Images, Hyperlinks, and Iframes</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #fff7ed, #ffedd5, #fae8ff);
      font-family: Arial, sans-serif;
      color: #7c2d12;
      padding: 30px;
    }
    h1, h2 {
      color: #c2410c;
    }
    img {
      border-radius: 16px;
      box-shadow: 0 14px 22px rgba(249,115,22,0.25);
      border: 4px solid #fdba74;
    }
    a {
      color: #7c3aed;
      text-decoration: none;
      font-weight: bold;
      margin-right: 12px;
    }
    a:hover {
      text-decoration: underline;
    }
    iframe {
      border-radius: 16px;
      border: 4px solid #fbbf24;
      margin-top: 15px;
      box-shadow: 0 14px 22px rgba(245,158,11,0.2);
    }
  </style>
</head>
<body>
  <h1>Multimedia and Embedding Example</h1>

  <img src="https://via.placeholder.com/300x200" width="300" height="200" alt="Sample placeholder image" />

  <p>
    <a href="https://www.google.com">Google</a> |
    <a href="https://www.wikipedia.org">Wikipedia</a> |
    <a href="https://www.example.com">Example</a>
  </p>

  <h2>Embedded External Webpage</h2>
  <iframe src="https://example.com" width="600" height="400" title="Example website iframe"></iframe>
</body>
</html>
