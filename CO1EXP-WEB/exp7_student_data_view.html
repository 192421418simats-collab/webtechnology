<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Data XML View</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8, #ecfeff);
      color: #1f2937;
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #4338ca;
    }
    .container {
      max-width: 900px;
      margin: 20px auto;
      background: rgba(255,255,255,0.85);
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 14px 30px rgba(67,56,202,0.12);
    }
    .student-card {
      background: linear-gradient(135deg, #ffffff, #eef6ff);
      border: 2px solid #c7d2fe;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 18px rgba(99,102,241,0.08);
    }
    .student-card h2 {
      margin-top: 0;
      color: #4f46e5;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .label {
      font-weight: bold;
      color: #374151;
    }
    .value {
      color: #111827;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Data</h1>

    <div class="student-card">
      <div class="badge">Student 1</div>
      <h2>Rahul Sharma</h2>
      <div class="row"><span class="label">Roll Number:</span><span class="value">101</span></div>
      <div class="row"><span class="label">Department:</span><span class="value">Computer Science</span></div>
      <div class="row"><span class="label">Year:</span><span class="value">2nd Year</span></div>
      <div class="row"><span class="label">Email:</span><span class="value">rahul.sharma@example.com</span></div>
      <div class="row"><span class="label">Mobile:</span><span class="value">9876543210</span></div>
    </div>

    <div class="student-card">
      <div class="badge">Student 2</div>
      <h2>Priya Verma</h2>
      <div class="row"><span class="label">Roll Number:</span><span class="value">102</span></div>
      <div class="row"><span class="label">Department:</span><span class="value">Information Technology</span></div>
      <div class="row"><span class="label">Year:</span><span class="value">3rd Year</span></div>
      <div class="row"><span class="label">Email:</span><span class="value">priya.verma@example.com</span></div>
      <div class="row"><span class="label">Mobile:</span><span class="value">9123456780</span></div>
    </div>
  </div>
</body>
</html>
