<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiment 3: Class Timetable</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #eff6ff, #fef3c7, #e0f2fe);
      font-family: Arial, sans-serif;
      padding: 30px;
      color: #1e293b;
    }
    h1 {
      color: #1d4ed8;
      text-align: center;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 12px 28px rgba(30,64,175,0.15);
    }
    th, td {
      padding: 14px 18px;
      border: 2px solid #60a5fa;
      text-align: center;
    }
    th {
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      color: white;
    }
    caption {
      font-weight: bold;
      margin-bottom: 12px;
      color: #1e3a8a;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <h1>Class Timetable</h1>

  <table border="1" cellpadding="8" cellspacing="0">
    <caption>Semester 5 Timetable</caption>
    <tr>
      <th>Time</th>
      <th>Monday</th>
      <th>Tuesday</th>
      <th>Wednesday</th>
      <th>Thursday</th>
      <th>Friday</th>
    </tr>
    <tr>
      <td>9:00-10:00</td>
      <td>Math</td>
      <td>DBMS</td>
      <td>OS</td>
      <td>Web Tech</td>
      <td>Python</td>
    </tr>
    <tr>
      <td>10:00-11:00</td>
      <td colspan="2">Lab Session</td>
      <td>Java</td>
      <td>Math</td>
      <td>DBMS</td>
    </tr>
    <tr>
      <td>11:00-12:00</td>
      <td>Java</td>
      <td rowspan="2">Seminar</td>
      <td>Web Tech</td>
      <td>OS</td>
      <td>Project</td>
    </tr>
    <tr>
      <td>12:00-1:00</td>
      <td>Lunch</td>
      <td>Lunch</td>
      <td>Lunch</td>
      <td>Lunch</td>
    </tr>
    <tr>
      <td>2:00-3:00</td>
      <td>Networking</td>
      <td>AI</td>
      <td>Python</td>
      <td colspan="2">Workshop</td>
    </tr>
  </table>
</body>
</html>
