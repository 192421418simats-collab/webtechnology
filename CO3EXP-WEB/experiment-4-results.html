<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Experiment 4 | Result Analysis</title>
    <style>
      :root {
        --ink: #213547;
        --accent: #e76f51;
        --bg: #f8f4ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          15px system-ui,
          sans-serif;
        margin: 0;
      }
      .wrap {
        margin: 0 auto;
        max-width: 900px;
        padding: 45px 22px;
      }
      header {
        border-bottom: 1px solid #d6cec0;
        margin-bottom: 30px;
        padding-bottom: 26px;
      }
      .tag {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(32px, 6vw, 58px);
        letter-spacing: -0.05em;
        margin: 10px 0;
      }
      header p {
        color: #687681;
      }
      .form {
        align-items: end;
        display: grid;
        gap: 13px;
        grid-template-columns: 1.4fr repeat(3, 1fr) auto;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label {
        font-size: 12px;
        font-weight: 700;
      }
      input {
        border: 1px solid #cfc6b7;
        font: inherit;
        padding: 11px;
        width: 100%;
      }
      button {
        background: var(--ink);
        border: 0;
        color: white;
        cursor: pointer;
        padding: 12px 18px;
      }
      table {
        border-collapse: collapse;
        margin-top: 38px;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid #d6cec0;
        padding: 15px 10px;
        text-align: left;
      }
      th {
        color: #687681;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .badge {
        color: var(--accent);
        font-weight: 700;
      }
      .stats {
        display: flex;
        gap: 24px;
        margin-top: 22px;
      }
      .stat {
        border-left: 3px solid var(--accent);
        padding-left: 12px;
      }
      .stat small {
        color: #687681;
        display: block;
        font-size: 11px;
        text-transform: uppercase;
      }
      .back {
        color: var(--ink);
        display: block;
        font-size: 13px;
        margin-top: 30px;
      }
      @media (max-width: 650px) {
        .form {
          grid-template-columns: 1fr 1fr;
        }
        .form .field:first-child {
          grid-column: 1/-1;
        }
        .form button {
          grid-column: 1/-1;
        }
        .table-wrap {
          overflow-x: auto;
        }
        .stats {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <div class="tag">Experiment 04 / Academic records</div>
        <h1>Result analysis.</h1>
        <p>
          Add student marks and let the system calculate totals, averages, and
          performance.
        </p>
      </header>
      <form id="marks" class="form">
        <div class="field">
          <label for="student">Student name</label
          ><input id="student" required />
        </div>
        <div class="field">
          <label for="html">HTML</label
          ><input id="html" type="number" min="0" max="100" required />
        </div>
        <div class="field">
          <label for="css">CSS</label
          ><input id="css" type="number" min="0" max="100" required />
        </div>
        <div class="field">
          <label for="js">JavaScript</label
          ><input id="js" type="number" min="0" max="100" required />
        </div>
        <button>Add result</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>HTML</th>
              <th>CSS</th>
              <th>JavaScript</th>
              <th>Total</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="stats" class="stats"></div>
      <a class="back" href="experiment-1-profile.html"
        >← Back to experiment 1</a
      >
    </main>
    <script>
      const results = [];
      const form = document.querySelector("#marks");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const scores = [
          html.valueAsNumber,
          css.valueAsNumber,
          js.valueAsNumber,
        ];
        if (!student.value || scores.some(Number.isNaN)) return;
        results.push({
          name: student.value,
          marks: scores,
          total: scores.reduce((sum, mark) => sum + mark, 0),
        });
        render();
        form.reset();
      });
      function render() {
        rows.innerHTML = results
          .map((result) => {
            const average = result.total / 3;
            const grade =
              average >= 90
                ? "A"
                : average >= 75
                  ? "B"
                  : average >= 60
                    ? "C"
                    : "D";
            return `<tr><td>${result.name}</td>${result.marks.map((mark) => `<td>${mark}</td>`).join("")}<td>${result.total}</td><td class="badge">${grade}</td></tr>`;
          })
          .join("");
        const totals = results.map((result) => result.total);
        stats.innerHTML = totals.length
          ? `<div class="stat"><small>Highest total</small><strong>${Math.max(...totals)}</strong></div><div class="stat"><small>Lowest total</small><strong>${Math.min(...totals)}</strong></div><div class="stat"><small>Class average</small><strong>${(totals.reduce((sum, total) => sum + total, 0) / totals.length).toFixed(1)}</strong></div>`
          : "";
      }
    </script>
  </body>
</html>
