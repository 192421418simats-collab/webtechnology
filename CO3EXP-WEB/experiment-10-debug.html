<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Experiment 10 | Debug Lab</title>
    <style>
      /* DEBUG TASK: Open DevTools > Elements and inspect why this layout overflows. */
      * {
        box-sizing: border-box;
      }
      body {
        background: #eee;
        color: #222;
        font:
          16px system-ui,
          sans-serif;
        margin: 0;
      }
      .app {
        margin: 50px auto;
        max-width: 650px;
        padding: 20px;
      }
      .card {
        background: #fff;
        padding: 30px;
        width: 800px;
      }
      h1 {
        color: #b23a48;
      }
      .button {
        background: #b23a48;
        border: 0;
        color: white;
        cursor: pointer;
        padding: 12px 20px;
      }
      .message {
        margin-top: 20px;
        padding: 15px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card">
        <p>Experiment 10 / Debug lab</p>
        <h1>Find the fault.</h1>
        <p>
          Use the Elements panel to inspect layout, the Console to inspect the
          error, and Sources to add a breakpoint.
        </p>
        <button id="action" class="button">Run diagnostic</button>
        <div id="message" class="message">Waiting for diagnostic...</div>
      </section>
    </main>
    <script>
      /* DEBUG TASK: Use console.log() and debugger here. The selector below is intentionally wrong. */ document
        .querySelector("#action")
        .addEventListener("click", () => {
          debugger;
          try {
            const result = document.querySelector("#missing-message");
            result.textContent = "Diagnostic complete";
            console.log("Result:", result);
          } catch (error) {
            console.error("Inspect this error:", error);
            document.querySelector("#message").textContent =
              "The app caught an error. Use the console to find its cause.";
          }
        });
    </script>
  </body>
</html>
