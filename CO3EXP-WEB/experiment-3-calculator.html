<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Experiment 3 | Scientific Calculator</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #20232b;
        color: #f4f1eb;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }

      .calculator {
        background: #2c303a;
        border: 1px solid #474d5b;
        box-shadow: 0 25px 70px #0008;
        max-width: 390px;
        padding: 20px;
        width: calc(100% - 32px);
      }

      h1 {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.12em;
        margin: 0 0 18px;
        text-transform: uppercase;
      }

      .screen {
        background: #17191f;
        border: 0;
        color: #f4f1eb;
        font: 32px monospace;
        overflow: hidden;
        padding: 20px;
        text-align: right;
        width: 100%;
      }

      .keys {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(4, 1fr);
        margin-top: 12px;
      }

      .keys button {
        background: #3b414d;
        border: 0;
        color: #fff;
        cursor: pointer;
        font-size: 17px;
        min-height: 52px;
      }

      .keys button:hover {
        background: #596171;
      }

      .keys .operator {
        background: #d97757;
      }

      .keys .operator:hover {
        background: #ed8b69;
      }

      .keys .wide {
        grid-column: span 2;
      }

      .hint {
        color: #aeb4bd;
        font-size: 12px;
        margin: 15px 0 0;
      }
    </style>
  </head>
  <body>
    <main class="calculator">
      <h1>Scientific calculator</h1>
      <input
        id="screen"
        class="screen"
        value="0"
        aria-label="Calculator display"
        readonly
      />
      <div class="keys">
        <button data-action="clear">AC</button>
        <button data-action="back">⌫</button>
        <button data-value="(">(</button>
        <button data-value=")">)</button>
        <button data-value="sin(">sin</button>
        <button data-value="cos(">cos</button>
        <button data-value="sqrt(">√</button>
        <button data-value="^" class="operator">^</button>
        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button data-value="/" class="operator">÷</button>
        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button data-value="*" class="operator">×</button>
        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button data-value="-" class="operator">−</button>
        <button data-value="0" class="wide">0</button>
        <button data-value=".">.</button>
        <button data-value="+" class="operator">+</button>
        <button data-action="equals" class="wide operator">=</button>
      </div>
      <p class="hint">
        Use sin, cos, √ and powers for quick scientific calculations.
      </p>
    </main>
    <script>
      const screen = document.querySelector("#screen");
      let expression = "";

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target;

        if (button.tagName !== "BUTTON") return;

        const value = button.dataset.value;

        if (button.dataset.action === "clear") {
          expression = "";
          screen.value = "0";
        } else if (button.dataset.action === "back") {
          expression = expression.slice(0, -1);
          screen.value = expression || "0";
        } else if (button.dataset.action === "equals") {
          try {
            const safe = expression
              .replaceAll("^", "**")
              .replaceAll("sin(", "Math.sin(")
              .replaceAll("cos(", "Math.cos(")
              .replaceAll("sqrt(", "Math.sqrt(");

            expression = String(Function(`return ${safe}`)());
            screen.value = expression;
          } catch {
            screen.value = "Error";
            expression = "";
          }
        } else {
          expression += value;
          screen.value = expression;
        }
      });
    </script>
  </body>
</html>
