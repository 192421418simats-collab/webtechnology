<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Experiment 6 | To-Do List</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #edf1f7;
        color: #172235;
        font:
          16px system-ui,
          sans-serif;
        margin: 0;
      }
      .app {
        background: #fff;
        box-shadow: 0 20px 60px #1d355722;
        margin: 55px auto;
        max-width: 650px;
        padding: 35px 28px;
        width: calc(100% - 32px);
      }
      .tag {
        color: #4361ee;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 44px;
        letter-spacing: -0.06em;
        margin: 8px 0 25px;
      }
      .add {
        display: flex;
        gap: 8px;
      }
      .add input {
        border: 1px solid #cbd3df;
        flex: 1;
        font: inherit;
        padding: 13px;
      }
      .add button,
      .clear {
        background: #4361ee;
        border: 0;
        color: #fff;
        cursor: pointer;
        padding: 0 18px;
      }
      .filters {
        display: flex;
        gap: 8px;
        margin: 24px 0;
      }
      .filters button {
        background: none;
        border: 1px solid #dce2eb;
        color: #617087;
        cursor: pointer;
        padding: 7px 11px;
      }
      .filters button.active {
        border-color: #4361ee;
        color: #4361ee;
      }
      .task {
        align-items: center;
        border-top: 1px solid #e5e9ef;
        display: flex;
        gap: 12px;
        padding: 15px 0;
      }
      .task.done span {
        text-decoration: line-through;
        color: #9ca8b7;
      }
      .task span {
        flex: 1;
      }
      .delete {
        background: none;
        border: 0;
        color: #e35d6a;
        cursor: pointer;
        font-size: 18px;
      }
      .empty {
        color: #8995a5;
        text-align: center;
        padding: 30px;
      }
      .clear {
        display: block;
        margin: 22px 0 0 auto;
        padding: 9px 13px;
        font-size: 12px;
      }
      @media (max-width: 460px) {
        .add {
          display: grid;
          grid-template-columns: 1fr;
        }
        .add button {
          padding: 12px;
        }
        .filters {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="tag">Experiment 06 / Personal systems</div>
      <h1>Small steps, daily.</h1>
      <form id="add" class="add">
        <input
          id="taskInput"
          placeholder="What needs doing?"
          required
        /><button>Add task</button>
      </form>
      <div class="filters">
        <button class="active" data-filter="all">All</button
        ><button data-filter="open">Open</button
        ><button data-filter="done">Completed</button>
      </div>
      <section id="list" aria-live="polite"></section>
      <button id="clear" class="clear">Clear completed</button>
    </main>
    <script>
      const tasks = [];
      const list = document.querySelector("#list");
      document.querySelector("#add").addEventListener("submit", (event) => {
        event.preventDefault();
        tasks.push({ text: taskInput.value, done: false });
        taskInput.value = "";
        render();
      });
      document.querySelector(".filters").addEventListener("click", (event) => {
        if (event.target.matches("button")) {
          document
            .querySelectorAll(".filters button")
            .forEach((button) => button.classList.remove("active"));
          event.target.classList.add("active");
          render();
        }
      });
      list.addEventListener("click", (event) => {
        const index = event.target.closest(".task")?.dataset.index;
        if (index === undefined) return;
        if (event.target.matches("input"))
          tasks[index].done = !tasks[index].done;
        if (event.target.matches(".delete")) tasks.splice(index, 1);
        render();
      });
      document.querySelector("#clear").addEventListener("click", () => {
        for (let index = tasks.length - 1; index >= 0; index--)
          if (tasks[index].done) tasks.splice(index, 1);
        render();
      });
      function render() {
        const filter =
          document.querySelector(".filters .active").dataset.filter;
        const visible = tasks
          .map((task, index) => ({ ...task, index }))
          .filter(
            (task) =>
              filter === "all" ||
              (filter === "done" && task.done) ||
              (filter === "open" && !task.done),
          );
        list.innerHTML = visible.length
          ? visible
              .map(
                (task) =>
                  `<div class="task ${task.done ? "done" : ""}" data-index="${task.index}"><input type="checkbox" ${task.done ? "checked" : ""} aria-label="Complete ${task.text}"><span>${task.text}</span><button class="delete" aria-label="Delete task">×</button></div>`,
              )
              .join("")
          : '<div class="empty">Your list is clear.</div>';
      }
      render();
    </script>
  </body>
</html>
