<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Experiment 2 | Registration</title>
    <style>
      :root {
        --navy: #16324f;
        --teal: #2a9d8f;
        --bg: #eef5f4;
        --ink: #243746;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px system-ui,
          sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 50px auto;
        padding: 0 22px;
      }
      .card {
        background: #fff;
        border-top: 8px solid var(--teal);
        box-shadow: 0 15px 40px #16324f16;
        padding: clamp(24px, 5vw, 52px);
      }
      .eyebrow {
        color: var(--teal);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      h1 {
        color: var(--navy);
        font-size: clamp(32px, 6vw, 54px);
        margin: 10px 0 8px;
      }
      p {
        color: #66808c;
        line-height: 1.6;
      }
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: 1fr 1fr;
        margin-top: 30px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .wide {
        grid-column: 1/-1;
      }
      label {
        font-size: 13px;
        font-weight: 700;
      }
      input {
        border: 1px solid #ccd9dc;
        border-radius: 4px;
        font: inherit;
        padding: 13px;
      }
      input:focus {
        border-color: var(--teal);
        outline: 3px solid #2a9d8f22;
      }
      button {
        background: var(--navy);
        border: 0;
        color: white;
        cursor: pointer;
        font-weight: 700;
        margin-top: 10px;
        padding: 14px 22px;
      }
      button:hover {
        background: var(--teal);
      }
      .error {
        color: #c94c4c;
        font-size: 12px;
        min-height: 16px;
      }
      .success {
        background: #e5f5ef;
        color: #176b59;
        margin-top: 22px;
        padding: 14px;
      }
      .back {
        display: block;
        margin-top: 22px;
        color: var(--navy);
        font-size: 13px;
      }
      @media (max-width: 540px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wide {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <div class="eyebrow">Experiment 02 / Student services</div>
        <h1>Join the campus.</h1>
        <p>
          Register your student profile with accurate details. All fields are
          checked before submission.
        </p>
        <form id="registration" novalidate>
          <div class="grid">
            <div class="field">
              <label for="name">Full name</label
              ><input id="name" required /><small class="error"></small>
            </div>
            <div class="field">
              <label for="email">University email</label
              ><input id="email" type="email" required /><small
                class="error"
              ></small>
            </div>
            <div class="field">
              <label for="password">Create password</label
              ><input
                id="password"
                type="password"
                minlength="8"
                required
              /><small class="error"></small>
            </div>
            <div class="field">
              <label for="phone">Phone number</label
              ><input
                id="phone"
                type="tel"
                pattern="[0-9]{10}"
                required
              /><small class="error"></small>
            </div>
            <div class="field wide">
              <label for="course">Course and year</label
              ><input
                id="course"
                placeholder="e.g. B.Tech Computer Science, Year 2"
                required
              /><small class="error"></small>
            </div>
          </div>
          <button type="submit">Create student profile</button>
        </form>
        <div id="success" class="success" hidden></div>
      </section>
      <a class="back" href="experiment-1-profile.html"
        >← Back to experiment 1</a
      >
    </main>
    <script>
      const form = document.querySelector("#registration");
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        document
          .querySelectorAll(".error")
          .forEach((el) => (el.textContent = ""));
        let valid = true;
        const name = document.querySelector("#name");
        const email = document.querySelector("#email");
        const password = document.querySelector("#password");
        const phone = document.querySelector("#phone");
        [
          name,
          email,
          password,
          phone,
          document.querySelector("#course"),
        ].forEach((field) => {
          if (!field.checkValidity()) {
            field.nextElementSibling.textContent = field.validity.valueMissing
              ? "This field is required"
              : field.validity.typeMismatch
                ? "Enter a valid email"
                : "Please check this value";
            valid = false;
          }
        });
        if (valid) {
          const success = document.querySelector("#success");
          success.textContent = `Welcome, ${name.value.trim()}! Your registration is ready.`;
          success.hidden = false;
          form.reset();
        }
      });
    </script>
  </body>
</html>
