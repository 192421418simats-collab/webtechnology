<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Experiment 8 | Clock and Countdown</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #102a43;
        color: #f4f7f8;
        font-family: system-ui, sans-serif;
        margin: 0;
      }
      .wrap {
        margin: auto;
        max-width: 1000px;
        padding: 55px 25px;
      }
      .tag {
        color: #8ecae6;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(40px, 7vw, 75px);
        letter-spacing: -0.07em;
        line-height: 0.9;
        margin: 16px 0 60px;
      }
      .panels {
        display: grid;
        gap: 20px;
        grid-template-columns: 1fr 1fr;
      }
      .panel {
        border: 1px solid #496579;
        padding: 30px;
      }
      .label {
        color: #8ecae6;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .time {
        font-family: monospace;
        font-size: clamp(30px, 5vw, 57px);
        margin-top: 25px;
      }
      .note {
        color: #a7bbc6;
        font-size: 13px;
        line-height: 1.6;
      }
      @media (max-width: 600px) {
        .panels {
          grid-template-columns: 1fr;
        }
        h1 {
          margin-bottom: 35px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="tag">Experiment 08 / Time utilities</div>
      <h1>Keep an eye<br />on the clock.</h1>
      <section class="panels">
        <article class="panel">
          <div class="label">Current local time</div>
          <div id="clock" class="time">--:--:--</div>
          <p class="note">A live reading from your device’s local time zone.</p>
        </article>
        <article class="panel">
          <div class="label">Exam countdown</div>
          <div id="countdown" class="time">--:--:--</div>
          <p class="note">Countdown to the next study checkpoint.</p>
        </article>
      </section>
    </main>
    <script>
      const exam = new Date();
      exam.setHours(exam.getHours() + 2, 0, 0, 0);
      function pad(value) {
        return String(value).padStart(2, "0");
      }
      function update() {
        const now = new Date();
        clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const remaining = Math.max(0, exam - now);
        const hours = Math.floor(remaining / 36e5);
        const minutes = Math.floor((remaining % 36e5) / 6e4);
        const seconds = Math.floor((remaining % 6e4) / 1000);
        countdown.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
      }
      update();
      setInterval(update, 1000);
    </script>
  </body>
</html>
