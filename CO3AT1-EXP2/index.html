<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Processing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --ink: #202040;
            --muted: #666687;
            --accent: #ff5f6d;
            --accent-dark: #e74659;
            --glass: rgba(255, 255, 255, 0.78);
            --line: rgba(255, 255, 255, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            align-items: center;
            background: linear-gradient(135deg, #ff9966 0%, #ff5e62 45%, #6a5af9 100%);
            color: var(--ink);
            display: flex;
            font-family: 'Poppins', sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem 1rem;
            position: relative;
        }

        body::before,
        body::after {
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            content: '';
            position: fixed;
            z-index: -1;
        }

        body::before { height: 19rem; right: -6rem; top: -7rem; width: 19rem; }
        body::after { bottom: -9rem; height: 25rem; left: -10rem; width: 25rem; }

        .card {
            animation: rise-in 0.7s ease-out both;
            backdrop-filter: blur(18px);
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(62, 29, 83, 0.25);
            max-width: 38rem;
            padding: clamp(1.5rem, 5vw, 3rem);
            width: 100%;
        }

        .eyebrow { color: var(--accent-dark); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; margin: 0 0 0.5rem; text-transform: uppercase; }
        h1 { font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; margin: 0 0 0.5rem; }
        .intro { color: var(--muted); margin: 0 0 1.75rem; }
        form { display: grid; gap: 1rem; }
        .field { display: grid; gap: 0.4rem; }
        label { font-size: 0.88rem; font-weight: 600; }
        input, button { border-radius: 10px; box-sizing: border-box; font: inherit; width: 100%; }
        input { background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(96, 82, 155, 0.2); color: var(--ink); padding: 0.75rem 0.9rem; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 95, 109, 0.18); outline: none; }
        button { background: linear-gradient(100deg, var(--accent), #ff9966); border: 0; box-shadow: 0 8px 18px rgba(231, 70, 89, 0.25); color: white; cursor: pointer; font-weight: 700; margin-top: 0.5rem; padding: 0.85rem 1rem; transition: box-shadow 0.2s ease, transform 0.2s ease; }
        button:hover { box-shadow: 0 12px 24px rgba(231, 70, 89, 0.35); transform: translateY(-2px); }
        footer { border-top: 1px solid rgba(96, 82, 155, 0.15); color: var(--muted); font-size: 0.72rem; margin-top: 2rem; padding-top: 1rem; text-align: center; }
        @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 30em) { body { padding: 1rem; } .card { border-radius: 18px; } }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">Academic Record</p>
        <h1>Student Result Processing</h1>
        <p class="intro">Enter the details below to calculate the final result.</p>
        <form action="student-result" method="post">
            <div class="field"><label for="name">Student Name</label><input type="text" id="name" name="name" autocomplete="name" required></div>
            <div class="field"><label for="registerNumber">Register Number</label><input type="text" id="registerNumber" name="registerNumber" required></div>
            <div class="field"><label for="subject1">Subject 1 Mark</label><input type="number" id="subject1" name="subject1" min="0.01" max="99.99" step="any" required></div>
            <div class="field"><label for="subject2">Subject 2 Mark</label><input type="number" id="subject2" name="subject2" min="0.01" max="99.99" step="any" required></div>
            <div class="field"><label for="subject3">Subject 3 Mark</label><input type="number" id="subject3" name="subject3" min="0.01" max="99.99" step="any" required></div>
            <button type="submit">Process Result</button>
        </form>
        <footer>Assignment by ALUKA PARDHU (192421418)</footer>
    </main>
</body>
</html>
